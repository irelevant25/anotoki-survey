<dialog
    #dialog
    class="lightbox"
    [attr.aria-label]="'lightbox.label' | translate"
    (cancel)="onCancel($event)"
    (keydown)="onKeydown($event)"
    (click)="onClick($event)"
    (pointerdown)="onPointerDown($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerCancel()">
    <div class="stage">
        <!-- The picture's description and the caption are a survey's words, in the survey's language. -->
        <figure class="figure" [attr.lang]="lang()">
            <app-survey-image class="picture" [image]="image()" fit="contain" [natural]="true" [style.--ratio]="ratio()" />
            @if (caption()) {
                <figcaption class="caption">{{ caption() }}</figcaption>
            }
        </figure>
    </div>

    <!-- What a screen reader hears on each move: where it is, and what the picture shows. -->
    <p class="visually-hidden" aria-live="polite" [attr.lang]="spokenLang()">{{ spoken() }}</p>

    <div class="bar">
        @if (many()) {
            <span class="count" aria-hidden="true">{{ "lightbox.position" | translate: { n: view().index + 1, m: view().images.length } }}</span>
        }
        <button #closeButton type="button" class="round close" [attr.aria-label]="'common.close' | translate" (click)="dismiss.emit()">
            <app-icon name="x" [size]="20" />
        </button>
    </div>

    @if (many()) {
        <button type="button" class="round nav prev" [attr.aria-label]="'lightbox.previous' | translate" (click)="move.emit(-1)">
            <app-icon name="chevronLeft" [size]="24" />
        </button>
        <button type="button" class="round nav next" [attr.aria-label]="'lightbox.next' | translate" (click)="move.emit(1)">
            <app-icon name="chevronRight" [size]="24" />
        </button>
    }
</dialog>
