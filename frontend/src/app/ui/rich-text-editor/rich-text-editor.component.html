<div class="rte" [class.is-focused]="focused()" [class.is-invalid]="invalid()" [class.is-compact]="compact()">
    <div class="rte-toolbar" role="toolbar" [attr.aria-label]="label() + ': formatting'">
        @for (tool of tools; track tool.mark) {
            <button
                type="button"
                class="rte-tool"
                [class.is-on]="active()[tool.mark]"
                [attr.aria-pressed]="!!active()[tool.mark]"
                [attr.aria-label]="tool.label"
                [attr.title]="tool.keys ? tool.label + ' (' + tool.keys + ')' : tool.label"
                (mousedown)="$event.preventDefault()"
                (click)="apply(tool.mark)">
                <app-icon [name]="tool.icon" [size]="16" [strokeWidth]="2" />
            </button>
        }
        <button
            type="button"
            class="rte-tool"
            [class.is-on]="active().link || linkOpen()"
            [attr.aria-pressed]="!!active().link"
            [attr.aria-expanded]="linkOpen()"
            aria-label="Link"
            title="Link"
            (mousedown)="$event.preventDefault()"
            (click)="toggleLink()">
            <app-icon name="link" [size]="16" [strokeWidth]="2" />
        </button>

        <span class="rte-sep" aria-hidden="true"></span>

        @if (headings()) {
            <button
                type="button"
                class="rte-tool rte-tool-text"
                [class.is-on]="active().h2"
                [attr.aria-pressed]="!!active().h2"
                aria-label="Heading"
                title="Heading"
                (mousedown)="$event.preventDefault()"
                (click)="heading(2)">
                H2
            </button>
            <button
                type="button"
                class="rte-tool rte-tool-text"
                [class.is-on]="active().h3"
                [attr.aria-pressed]="!!active().h3"
                aria-label="Smaller heading"
                title="Smaller heading"
                (mousedown)="$event.preventDefault()"
                (click)="heading(3)">
                H3
            </button>
        }
        @for (tool of lists; track tool.mark) {
            <button
                type="button"
                class="rte-tool"
                [class.is-on]="active()[tool.mark]"
                [attr.aria-pressed]="!!active()[tool.mark]"
                [attr.aria-label]="tool.label"
                [attr.title]="tool.label"
                (mousedown)="$event.preventDefault()"
                (click)="apply(tool.mark)">
                <app-icon [name]="tool.icon" [size]="16" [strokeWidth]="2" />
            </button>
        }
        <button type="button" class="rte-tool" aria-label="Clear formatting" title="Clear formatting" (mousedown)="$event.preventDefault()" (click)="clearFormatting()">
            <app-icon name="eraser" [size]="16" [strokeWidth]="2" />
        </button>

        <span class="rte-spacer"></span>

        <button type="button" class="rte-tool" aria-label="Undo" title="Undo (Ctrl+Z)" [disabled]="!canUndo()" (mousedown)="$event.preventDefault()" (click)="undo()">
            <app-icon name="undo" [size]="16" [strokeWidth]="2" />
        </button>
        <button type="button" class="rte-tool" aria-label="Redo" title="Redo (Ctrl+Y)" [disabled]="!canRedo()" (mousedown)="$event.preventDefault()" (click)="redo()">
            <app-icon name="redo" [size]="16" [strokeWidth]="2" />
        </button>
    </div>

    @if (linkOpen()) {
        <form class="rte-link" (submit)="saveLink($event)">
            <app-icon name="link" [size]="15" />
            <input
                #linkInput
                class="rte-link-input"
                type="url"
                placeholder="https://…"
                aria-label="Link address"
                [value]="linkUrl()"
                (input)="linkUrl.set($any($event.target).value)"
                (keydown)="onLinkKeydown($event)" />
            <button type="submit" class="rte-link-button">Apply</button>
            @if (active().link) {
                <button type="button" class="rte-link-button rte-link-remove" (click)="removeLink()">
                    <app-icon name="unlink" [size]="14" />
                    Remove
                </button>
            }
        </form>
    }

    <div #content class="rte-body"></div>
</div>
