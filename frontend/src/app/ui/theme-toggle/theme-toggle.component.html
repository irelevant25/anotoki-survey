<div class="segmented" role="radiogroup" [attr.aria-label]="'theme.label' | translate" (keydown)="onKeydown($event)">
    @for (option of options; track option.mode) {
        <button
            #option
            type="button"
            role="radio"
            class="segment"
            [class.segment-compact]="compact()"
            [attr.aria-checked]="theme.mode() === option.mode"
            [attr.aria-label]="compact() ? (option.labelKey | translate) : null"
            [attr.title]="(option.mode === 'auto' ? 'theme.autoHint' : option.labelKey) | translate"
            [tabIndex]="theme.mode() === option.mode ? 0 : -1"
            (click)="theme.set(option.mode)">
            <app-icon [name]="option.icon" [size]="16" />
            @if (!compact()) {
                <span>{{ option.labelKey | translate }}</span>
            }
        </button>
    }
</div>
