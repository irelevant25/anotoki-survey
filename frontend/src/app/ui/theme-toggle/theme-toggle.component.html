<div class="segmented" role="radiogroup" aria-label="Theme" (keydown)="onKeydown($event)">
    @for (option of options; track option.mode) {
        <button
            #option
            type="button"
            role="radio"
            class="segment"
            [class.segment-compact]="compact()"
            [attr.aria-checked]="theme.mode() === option.mode"
            [attr.aria-label]="compact() ? option.label : null"
            [attr.title]="option.mode === 'auto' ? 'As your device is set' : option.label"
            [tabIndex]="theme.mode() === option.mode ? 0 : -1"
            (click)="theme.set(option.mode)">
            <app-icon [name]="option.icon" [size]="16" />
            @if (!compact()) {
                <span>{{ option.label }}</span>
            }
        </button>
    }
</div>
