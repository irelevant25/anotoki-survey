<div class="options" cdkDropList cdkDropListLockAxis="y" [cdkDropListData]="options()" (cdkDropListDropped)="drop($event)">
    @for (option of options(); track option.id; let i = $index, first = $first, last = $last) {
        <div class="option" cdkDrag [cdkDragData]="option.id" [class.is-other]="option.other">
            <div class="option-row">
                <span class="handle" cdkDragHandle aria-hidden="true" title="Drag to move"><app-icon name="grip" [size]="16" /></span>
                <span class="mark" [class.mark-round]="type() === 'single'" aria-hidden="true"></span>
                <input
                    class="option-input"
                    [attr.data-option]="option.id"
                    type="text"
                    maxlength="200"
                    [value]="option.label"
                    [placeholder]="option.other ? 'Other' : 'Option ' + (i + 1)"
                    [attr.aria-label]="questionLabel() + ', option ' + (i + 1) + (option.other ? ' (Other, with a field)' : '')"
                    (input)="rename(option.id, $event)"
                    (keydown)="onKeydown($event, option.id)"
                    (paste)="onPaste($event, option.id)" />
                @if (option.other) {
                    <span class="other-tag" title="Choosing it opens a field for the person's own answer">
                        <app-icon name="text" [size]="13" />
                        + own words
                    </span>
                }
                @if (counts()[option.id]) {
                    <span class="chosen" [title]="counts()[option.id] + ' chose it'">{{ counts()[option.id] }}</span>
                }
                <div class="option-actions">
                    <button
                        type="button"
                        class="icon-button"
                        [class.is-on]="option.images.length > 0"
                        [attr.aria-label]="'Add a picture to option ' + (i + 1)"
                        title="Add a picture (or paste one into the field)"
                        [disabled]="option.images.length >= maxImages"
                        (click)="pickImages(option.id)">
                        <app-icon name="image" [size]="15" />
                    </button>
                    <button type="button" class="icon-button icon-button-move" aria-label="Move up" title="Move up (Alt+↑)" [disabled]="first" (click)="move(option.id, -1)">
                        <app-icon name="arrowUp" [size]="15" />
                    </button>
                    <button type="button" class="icon-button icon-button-move" aria-label="Move down" title="Move down (Alt+↓)" [disabled]="last" (click)="move(option.id, 1)">
                        <app-icon name="arrowDown" [size]="15" />
                    </button>
                    <button type="button" class="icon-button icon-button-danger" aria-label="Remove this option" title="Remove" (click)="remove(option.id)">
                        <app-icon name="x" [size]="15" />
                    </button>
                </div>
            </div>
            <app-image-list-editor
                class="option-images"
                [compact]="true"
                [images]="option.images"
                [questionId]="questionId()"
                [optionId]="option.id"
                [max]="maxImages"
                [label]="'Option ' + (i + 1)"
                [caption]="option.label" />
        </div>
    }
</div>

<div class="adds">
    <button appButton size="sm" variant="ghost" (click)="add()">
        <app-icon name="plus" [size]="15" />
        Add an option
    </button>
    @if (!hasOther()) {
        <button appButton size="sm" variant="ghost" (click)="addOther()">
            <app-icon name="plus" [size]="15" />
            Add "Other" with a field
        </button>
    }
    <span class="tip">Enter adds the next one · paste a list for one option per line</span>
</div>
