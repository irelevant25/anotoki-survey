<div class="page">
    <anotoki-page-header heading="System" lead="What keeps the site running: the people who signed in, what failed, who changed what, the backups and the database's updates." />

    @if (auth.isAdmin()) {
        <ul class="list">
            @for (page of pages; track page.path) {
                <li>
                    <a class="item" [routerLink]="page.path">
                        <span class="icon" aria-hidden="true"><anotoki-icon [name]="page.icon" [size]="20" /></span>
                        <span class="words">
                            <span class="label">{{ page.label }}</span>
                            <span class="text">{{ page.text }}</span>
                        </span>
                        <anotoki-icon class="arrow" name="chevronRight" [size]="18" />
                    </a>
                </li>
            }
        </ul>
    } @else {
        <div class="no-access">
            <anotoki-empty-state
                icon="lock"
                heading="These pages are for the site's administrators"
                text="The people, the logs, the backups and the database's updates are an administrator's. Your role here is editor.">
                <a anotokiButton variant="primary" routerLink="/admin">See the surveys</a>
            </anotoki-empty-state>
        </div>
    }
</div>
