@if (auth.isStaff()) {
    <!-- The family's frame: the column on the left (the panel's name, the person, Back, Sign out, the theme, the pages), the page
         on the right - in the measure the panel's pages always had - and the family's footer under it, in the admin panel's English:
         the version and What's new, Feedback while the site runs (not round the Migrations page while an update waits: the server
         would refuse the message), About · Support · Terms · Privacy · Contact. -->
    <anotoki-admin-frame [brand]="brand()" [person]="person()" [back]="back()" [signOut]="signOut" [groups]="groups()" [current]="current()">
        <anotoki-theme-toggle adminFrameTheme />
        <!-- Above every page, outside <main>: while the site is closed for maintenance, the line that says so (the site settings'). -->
        <anotoki-page-notice adminFrameNotice />
        <div class="page-width">
            <router-outlet />
        </div>
        <anotoki-site-footer adminFrameFooter [version]="changelog.current()" [whatsNew]="changelog.current() !== null" (whatsNew)="changelog.open()" [feedback]="!siteStatus.blocked()" />
    </anotoki-admin-frame>
} @else {
    <!-- A page of its own, without the frame's column: nothing beside it suggests there is more to see. -->
    <!-- Focus is moved by hand: with <base href="/">, a bare #main would resolve to /#main and leave the page. -->
    <a class="skip-link" href="#main" (click)="$event.preventDefault(); main.focus()">Skip to the content</a>

    <main #main id="main" class="content" tabindex="-1">
        @if (!auth.signedIn()) {
            <!-- Its own Sign in: there is no other here. -->
            <div class="no-access">
                <anotoki-empty-state
                    icon="lock"
                    heading="You are signed out"
                    text="Your session has ended. Sign in again: what you typed on the Translations and Languages pages is kept in this tab, and will be in its boxes again. Changes to a survey that were not saved yet stay only while this page is open - sign in again in another tab to save them.">
                    <button anotokiButton variant="primary" (click)="signIn()">
                        <anotoki-icon name="logIn" [size]="16" />
                        Sign in
                    </button>
                </anotoki-empty-state>
            </div>
        } @else {
            <div class="no-access">
                <anotoki-empty-state
                    icon="lock"
                    heading="The admin panel is for the people who write the surveys"
                    text="Your anotoki account has no editor role here. The site's administrator can give it to you in the anotoki account's admin panel.">
                    <a anotokiButton variant="primary" routerLink="/">See the open surveys</a>
                </anotoki-empty-state>
            </div>
        }
    </main>

    <!-- The family's footer under the cards too, as under the panel. -->
    <anotoki-site-footer [version]="changelog.current()" [whatsNew]="changelog.current() !== null" (whatsNew)="changelog.open()" [feedback]="!siteStatus.blocked()" />
}
