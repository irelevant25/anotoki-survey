@if (auth.visitorDays(); as days) {
    <anotoki-alert class="visitor-notice" tone="info">
        {{ "visitor.notice" | translatePlural: days }}
        <div alertActions>
            <button anotokiButton size="sm" (click)="signIn()">
                <anotoki-icon name="logIn" [size]="15" />
                {{ "common.signIn" | translate }}
            </button>
        </div>
    </anotoki-alert>
}
