<!-- Focus is moved by hand: with <base href="/">, a bare #main would resolve to /#main and leave the page. -->
<a class="skip-link" href="#main" (click)="$event.preventDefault(); main.focus()">Skip to the content</a>

<app-top-bar area="admin" />

<main #main id="main" class="content" tabindex="-1">
    @if (auth.isStaff()) {
        <router-outlet />
    } @else if (!auth.signedIn()) {
        <!-- Its own Sign in: on a phone the top bar's is inside its menu. -->
        <div class="no-access">
            @if (auth.signInFailure()) {
                <!-- A sign-in that came back without one (or could not start): nobody had a session to end. The toast says why. -->
                <anotoki-empty-state
                    icon="lock"
                    heading="You are not signed in"
                    text="The admin panel is for the people who write the surveys, signed in with their anotoki account. The sign-in did not complete - sign in to try again.">
                    <ng-container [ngTemplateOutlet]="signInButton" />
                </anotoki-empty-state>
            } @else {
                <anotoki-empty-state
                    icon="lock"
                    heading="You are signed out"
                    text="Your session has ended. Sign in again: what you typed on the Translations and Languages pages is kept in this tab, and will be in its boxes again. Changes to a survey that were not saved yet stay only while this page is open - sign in again in another tab to save them.">
                    <ng-container [ngTemplateOutlet]="signInButton" />
                </anotoki-empty-state>
            }
        </div>
    } @else {
        <div class="no-access">
            <anotoki-empty-state
                icon="lock"
                heading="The admin panel is for the people who write the surveys"
                text="Your anotoki account has no editor role here. The site's administrator can give it to you in the anotoki account's admin panel.">
                <a anotokiButton variant="primary" routerLink="/">See the open surveys</a>
            </anotoki-empty-state>
        </div>
    }
</main>

<ng-template #signInButton>
    <button anotokiButton variant="primary" (click)="signIn()">
        <anotoki-icon name="logIn" [size]="16" />
        Sign in
    </button>
</ng-template>
