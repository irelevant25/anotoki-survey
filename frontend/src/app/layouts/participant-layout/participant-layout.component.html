<!-- Focus is moved by hand: with <base href="/">, a bare #main would resolve to /#main and leave the page. -->
<a class="skip-link" href="#main" (click)="$event.preventDefault(); main.focus()">{{ "common.skipToSurvey" | translate }}</a>

<app-top-bar area="survey" width="narrow" />

<div class="page">
    <main #main id="main" class="main" tabindex="-1">
        @if (showPage()) {
            <router-outlet />
        } @else {
            <div class="signed-out">
                <app-empty-state icon="lock" [heading]="'signedOut.heading' | translate" [text]="'signedOut.text' | translate">
                    <button appButton variant="primary" (click)="signIn()">
                        <app-icon name="logIn" [size]="16" />
                        {{ "common.signIn" | translate }}
                    </button>
                </app-empty-state>
            </div>
        }
    </main>
</div>
