<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>anotoki survey</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="description" content="Tell the anotoki sites what you like and what you do not." />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#f3f6fb" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="apple-touch-icon" href="anotoki.png" />
        <!-- Before anything is drawn: the theme shown last (the anotoki family's script, @anotoki/lib/assets - copied by angular.json). -->
        <script src="theme-boot.js" data-storage-key="anotoki-survey:theme"></script>
        <!-- The family's visitor counter (Umami). async: the app never waits for it. No query string or fragment: the sign-in's code arrives in the query. -->
        <script async src="https://umami.anotoki.eu/script.js" data-website-id="0e207e45-50bc-48ab-b6c3-8db08aac1be6" data-exclude-search="true" data-exclude-hash="true"></script>
    </head>
    <body>
        <app-root></app-root>
        <noscript>
            <p style="font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5">
                The anotoki survey needs JavaScript. Please switch it on and reload the page.
                <span lang="sk">Prieskum anotoki potrebuje JavaScript. Zapnite ho, prosím, a načítajte stránku znova.</span>
            </p>
        </noscript>
    </body>
</html>
